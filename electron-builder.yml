appId: me.akabeko.parade
productName: Parade
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!node_modules/**/*"
asar: true
mac:
  # Build for both Apple Silicon (arm64) and Intel (x64). The app ships no
  # native modules, so both architectures can be built on a single host.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # The plate of build/icon.png fills the whole canvas, which suits Windows and
  # Linux. macOS 15 and earlier draw the icon as is, so macOS gets a variant
  # that keeps the margin of the Apple icon grid.
  icon: build/icon-mac.png
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
win:
  target:
    - nsis
    - zip
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
linux:
  # Maintainer field of the deb package. When set, electron-builder does not
  # read the author email from package.json, so no personal email address has
  # to appear in the code (a GitHub noreply address is used here).
  maintainer: akabeko <1257526+akabekobeko@users.noreply.github.com>
  # Must be set explicitly: without it Linux falls back to mac.icon.
  icon: build/icon.png
  target:
    - AppImage
    - deb
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
