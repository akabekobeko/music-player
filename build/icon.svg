<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Parade app icon</title>
  <!--
    App icon: an extra bold letter P carrying a torch flame over its bowl,
    standing for the parade torch. All colors are Tailwind CSS v4 palette
    values (oklch). build/icon.png is rasterised from this file at 1024px via
    qlmanage; regenerate both files together when the design changes.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="oklch(27.9% 0.041 260.031)"/>
      <stop offset="1" stop-color="oklch(12.9% 0.042 264.695)"/>
    </linearGradient>
    <!-- Flame local space: y runs from the tail tip (0) to the core (512). -->
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="oklch(63.7% 0.237 25.331)"/>
      <stop offset="0.5" stop-color="oklch(70.5% 0.213 47.604)"/>
      <stop offset="1" stop-color="oklch(82.8% 0.189 84.429)"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g transform="translate(574 467.5) scale(1.0) rotate(-18) translate(-522.5 -525.0)">
    <!-- Extra bold P with its bowl counter -->
    <path d="M300 230 H580 A165 165 0 0 1 580 560 H470 V870 H300 Z M470 320 H580 A75 75 0 0 1 580 470 H470 Z" fill="oklch(98.7% 0.022 95.277)" fill-rule="evenodd"/>
    <!-- Bright core filling the hollow of the flame -->
    <circle cx="538" cy="398" r="83.6" fill="oklch(94.5% 0.129 101.54)"/>
    <!-- Flame covering the counter, tilted so the tail rises past the top of the P -->
    <g transform="rotate(50 538 398) translate(244.8 607.9) scale(0.82) rotate(-90)">
      <path fill="url(#fire)" d="M332.16,104.596c-34.594-27.688-48.125-58.25-53.328-79.969c-4.172-17.453-1.953-19.328-1.953-19.328c-0.219-2.078-1.5-3.875-3.406-4.75c-1.875-0.875-4.094-0.703-5.797,0.484c0,0-6.703,1.453-17.641,12.063c-24.875,24.156-53.031,64.469-34.469,119.578c19.891,59.125,9.375,71.5-1.047,70.688c-13.516-1.031-15.609-9.359-13.438-35.266c2.516-30.281-24.953-56.141-24.953-56.141s-42.672,67.844-75.953,116.375c-19.672,28.688-29.109,65.141-29.109,98.406H70.41c0,102.313,82.938,185.266,185.25,185.266s185.25-82.953,185.25-185.266C447.941,237.893,399.691,158.611,332.16,104.596z M255.988,459.83c-56.422,0-102.188-45.75-102.188-102.188c0-19.219,5.328-37.188,14.547-52.547c7.938,29.563,34.906,51.328,66.969,51.328c38.281,0,69.344-31.047,69.344-69.344c0-7.297-1.156-14.359-3.25-20.969c33.656,16.719,56.766,51.422,56.766,91.531C358.175,414.08,312.425,459.83,255.988,459.83z"/>
    </g>
  </g>
</svg>
