name: CI

on:
  push:
    branches: [main]
  pull_request:

# 単体テストの実行に書き込み権限は不要なため、読み取り専用に制限する
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml を single source of truth としてツールバージョンを読み取る
      # (setup-node の node-version-file は mise.toml 未対応のため自前でパース)
      - name: Read tool versions from mise.toml
        id: versions
        run: |
          node_version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          pnpm_version=$(sed -n 's/^"npm:pnpm" = "\(.*\)"$/\1/p' mise.toml)
          test -n "$node_version" && test -n "$pnpm_version"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # 単体テストでは electron モジュールを src/test/electron.mock.ts に
          # 差し替えているため、実バイナリーのダウンロードは不要
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run unit tests
        run: pnpm vitest run
