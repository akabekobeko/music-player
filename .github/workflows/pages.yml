name: Pages

# Publishes the website (web/) to GitHub Pages
# (docs/specs/web/architecture/deploy.md). The repository setting
# "Pages > Source" must be "GitHub Actions".
#
# Triggers:
# - push to main under web/: a site change
# - Release workflow completed: the download page picks up the new assets
#   (the version commit pushed by release.yml uses GITHUB_TOKEN, which never
#   fires the push trigger, so workflow_run is the only path for releases)
# - workflow_dispatch: republish by hand, e.g. after a transient API failure
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip when the Release workflow failed, so the site never points at a
    # release whose assets are missing
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read tool versions from mise.toml, the single source of truth
      # (setup-node cannot read mise.toml, so parse it here; same as ci.yml)
      - name: Read tool versions from mise.toml
        id: versions
        run: |
          node_version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          pnpm_version=$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' mise.toml)
          test -n "$node_version" && test -n "$pnpm_version"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm

      # The lockfile lives at the workspace root, so install there and build
      # the web package through the workspace filter
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # The root install pulls in electron; the site never runs it
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build the website
        run: pnpm --filter parade-web build
        env:
          # Authenticated requests to the GitHub REST API (5,000 per hour)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
