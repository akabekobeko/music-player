name: Release Drafter

# Keeps the draft of the next release up to date.
# - push: every merge into main regenerates the draft
# - workflow_dispatch: run manually after changing labels of merged pull
#   requests, because label changes alone do not trigger this workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Create and update the draft release
      contents: write
      # Read merged pull requests and their labels
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
